[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "searchrelay"
version = "0.1.0"
description = "Local-first, free-only web search routing for applications and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.26,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
searchrelay = "searchrelay.cli:main"

[project.urls]
Repository = "https://github.com/ivanmarkchang/searchrelay"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

